<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Happy Birthday 🎉</title>

<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    background: linear-gradient(to bottom, #cce7ff, #f5fbff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    overflow: hidden;
  }

  .card {
    width: 260px;
    height: 170px;
    background: #2b7de9;
    color: white;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.2rem;
    animation: pulse 1.5s infinite;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    cursor: pointer;
    z-index: 3;
    text-align: center;
    padding: 20px;
  }

  @keyframes pulse {
    50% { transform: scale(1.05); }
  }

  .music-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #2b7de9;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    z-index: 5;
  }

  .message {
    display: none;
    background: white;
    width: 90%;
    max-width: 380px;
    height: 320px;
    padding: 16px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    color: #0a2540;
    z-index: 3;
    flex-direction: column;
    overflow: hidden;
  }

  h1 {
    color: #2b7de9;
    text-align: center;
    font-size: 1.4rem;
    margin: 4px 0;
  }

  .cake-symbol {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 6px;
  }

  #textMessage {
    flex: 1;
    overflow-y: auto;
    padding-right: 6px;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  #textMessage p {
    margin-bottom: 12px;
  }

  .firework {
    position: fixed;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: firework 1.4s ease-out forwards;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes firework {
    to {
      transform: translate(var(--dx), var(--dy));
      opacity: 0;
    }
  }

  .falling {
    position: fixed;
    top: -40px;
    font-size: 20px;
    animation: fall linear forwards;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes fall {
    to {
      transform: translateY(110dvh) rotate(360deg);
      opacity: 0;
    }
  }
</style>
</head>

<body>

<!-- 🎵 AUDIO -->
<audio id="bgMusic" loop>
  <source src="nanna_movie_vikram.mp3" type="audio/mpeg">
</audio>

<button class="music-btn" onclick="playMusic()">🎵 Play Music</button>

<div class="card" id="openCard" onclick="openCard()">🎁 Tap to Open 🎉</div>

<div class="message" id="message">
  <h1>Happy Birthday Nituu papaaa 💙</h1>
  <div class="cake-symbol">🎂</div>
  <div id="textMessage"></div>
</div>

<script>
const music = document.getElementById("bgMusic");
let opened = false;

const TYPE_SPEED = 55;
const LINE_DELAY = 1200;

const lines = [
  You’re not just my best friend, you’re my family, my comfort, and the one place where my heart always feels safe. Thank you for being my constant—through my highs, my lows, my silence, and my chaos. You’ve seen every side of me and still chose to stay, and that means more to me than you’ll ever know.

Please never change. Stay the same beautiful soul with a childlike heart, the pure kindness you show without effort, and the warmth that makes everyone around you feel at home. I treasure the little things most—our random conversations, shared smiles, inside jokes no one else would understand, our late-night rides, and those quiet moments where time seems to pause and everything feels right.

I wish you a year filled with gentle happiness, growth that makes you proud, love that feels safe and true, and dreams that slowly, beautifully come to life 🌷✨
];

function playMusic() {
  music.volume = 0.6;
  music.play().catch(err => {
    alert("Please tap the Play Music button again 🎵");
  });
}

function showMessage() {
  const box = document.getElementById("textMessage");
  let i = 0;
  function nextLine() {
    if (i >= lines.length) return;
    const p = document.createElement("p");
    box.appendChild(p);
    let j = 0;
    function typeChar() {
      if (j < lines[i].length) {
        p.textContent += lines[i][j++];
        box.scrollTop = box.scrollHeight;
        setTimeout(typeChar, TYPE_SPEED);
      } else {
        i++;
        setTimeout(nextLine, LINE_DELAY);
      }
    }
    typeChar();
  }
  nextLine();
}

function openCard() {
  if (opened) return;
  opened = true;

  document.getElementById("openCard").style.display = "none";
  document.getElementById("message").style.display = "flex";
  showMessage();
}
</script>

</body>
</html>
